<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Livro de Estímulos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#3a2b3f;
    --cover:#241521;
    --cover-dark:#170d16;
    --gold:#c9a24b;
    --gold-dark:#8f7431;
    --page-l:#ecdcab;
    --page-r:#e2cd94;
    --ink:#3a2a1e;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.01ms !important;}
  }

  html,body{
    height:100dvh;
    width:100vw;
    overflow:hidden;
    background:var(--bg);
    font-family:'VT323', monospace;
    color:var(--ink);
  }

  .stage{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:1.6dvh;
    padding:2dvh 2vw;
  }

  .stage-title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(13px, 2.6dvh, 26px);
    color:#f4e9c8;
    text-shadow:3px 3px 0 rgba(0,0,0,0.5);
    letter-spacing:0.02em;
    flex:0 0 auto;
  }

  /* pixel-cut corners, reusable */
  .pixel-corner{
    --step:8px;
    clip-path: polygon(
      0 var(--step), var(--step) var(--step), var(--step) 0,
      calc(100% - var(--step)) 0, calc(100% - var(--step)) var(--step), 100% var(--step),
      100% calc(100% - var(--step)), calc(100% - var(--step)) calc(100% - var(--step)), calc(100% - var(--step)) 100%,
      var(--step) 100%, var(--step) calc(100% - var(--step)), 0 calc(100% - var(--step))
    );
  }
  .pixel-corner.lg{ --step:14px; }
  .pixel-corner.md{ --step:9px; }
  .pixel-corner.sm{ --step:6px; }

  /* ---------- book shell with stacked-page depth ---------- */

  .book{
    position:relative;
    flex:1 1 auto;
    min-height:0;
    width:min(96vw, 1180px);
    display:flex;
  }

  .book::before,
  .book::after{
    content:"";
    position:absolute;
    z-index:0;
  }
  .book::before{
    top:10px; left:10px; right:-12px; bottom:-12px;
    background:var(--cover-dark);
  }
  .book::after{
    top:5px; left:5px; right:-6px; bottom:-6px;
    background:#0f080e;
  }

  .cover{
    position:relative;
    z-index:1;
    flex:1;
    min-height:0;
    background:
      linear-gradient(180deg, #2c1a29 0%, #2c1a29 45%, var(--cover) 45%, var(--cover) 100%);
    border:4px solid var(--gold);
    padding:1.4dvh 1.2vw;
    box-shadow:10px 10px 0 rgba(0,0,0,0.4);
  }

  /* corner metal caps */
  .cap{
    position:absolute;
    width:16px; height:16px;
    background:var(--gold);
    box-shadow:inset -3px -3px 0 var(--gold-dark), inset 2px 2px 0 #f1dfa8;
    z-index:2;
  }
  .cap.tl{ top:-4px; left:-4px; }
  .cap.tr{ top:-4px; right:-4px; }
  .cap.bl{ bottom:-4px; left:-4px; }
  .cap.br{ bottom:-4px; right:-4px; }

  .pages{
    position:relative;
    height:100%;
    display:grid;
    grid-template-columns:1fr minmax(14px, 1.6vw) 1fr;
    background:var(--cover);
  }

  .spine{
    position:relative;
    background:repeating-linear-gradient(
      180deg,
      #170d16 0px, #170d16 9px,
      #1f1220 9px, #1f1220 18px
    );
    box-shadow:inset 3px 0 6px rgba(0,0,0,0.5), inset -3px 0 6px rgba(0,0,0,0.5);
  }
  .spine::before{
    content:"";
    position:absolute;
    top:6%; bottom:6%; left:50%;
    width:0;
    border-left:2px dashed var(--gold-dark);
    opacity:0.8;
  }

  .page{
    position:relative;
    min-height:0;
    min-width:0;
    display:flex;
    flex-direction:column;
    padding:1.6dvh 1.4vw;
    border:3px solid rgba(0,0,0,0.35);
    overflow:hidden;
  }
  .page.left{ background:var(--page-l); }
  .page.right{ background:var(--page-r); }

  /* shadow near the spine to suggest the page curving inward */
  .page.left::before{
    content:"";
    position:absolute;
    top:0; bottom:0; right:0;
    width:22px;
    background:linear-gradient(90deg, transparent, rgba(0,0,0,0.16));
    pointer-events:none;
  }
  .page.right::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:0;
    width:22px;
    background:linear-gradient(270deg, transparent, rgba(0,0,0,0.16));
    pointer-events:none;
  }

  /* folded corner, bottom-right of the right page */
  .dogear{
    position:absolute;
    right:0; bottom:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 34px 34px;
    border-color:transparent transparent rgba(0,0,0,0.22) transparent;
  }
  .dogear::before{
    content:"";
    position:absolute;
    right:2px; bottom:2px;
    width:0; height:0;
    border-style:solid;
    border-width:0 0 26px 26px;
    border-color:transparent transparent #cdb27c transparent;
  }

  .plate{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(9px, 1.6dvh, 15px);
    color:var(--ink);
    margin-bottom:1.4dvh;
    flex:0 0 auto;
    position:relative;
    z-index:1;
  }

  .seal-field{
    position:relative;
    z-index:1;
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:1.1dvh;
  }

  .seal-field.left-grid{
    grid-template-areas:
      "a a b b"
      "c c d e";
  }
  .seal-field.right-grid{
    grid-template-areas:
      "a a a a"
      "b b c c";
  }

  .seal{
    container-type:inline-size;
    min-height:0;
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6%;
    text-decoration:none;
    color:#fbf1da;
    border:none;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,0.28),
      inset 4px 4px 0 rgba(255,255,255,0.22);
    transition:transform 100ms ease, filter 100ms ease;
    cursor:pointer;
  }

  .seal:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  .seal:active{ transform:translateY(1px); filter:brightness(0.96); }
  .seal:focus-visible{ outline:3px solid #fff; outline-offset:2px; }

  .seal .pixel-icon{
    width:26%;
    height:26%;
    min-width:14px;
    min-height:14px;
    color:#fbf1da;
    shape-rendering:crispEdges;
  }
  .seal .pixel-icon rect{ fill:currentColor; }

  .seal span{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(8px, 11cqw, 13px);
    text-align:center;
    line-height:1.35;
    text-shadow:2px 2px 0 rgba(0,0,0,0.35);
    padding:0 8%;
  }

  .c-crimson{ background:#a8404a; }
  .c-navy{    background:#33526e; }
  .c-forest{  background:#436b47; }
  .c-amber{   background:#bd8138; }
  .c-plum{    background:#7d5488; }
  .c-teal{    background:#357a75; }

  .seal-a{ grid-area:a; }
  .seal-b{ grid-area:b; }
  .seal-c{ grid-area:c; }
  .seal-d{ grid-area:d; }

  .seal.add{
    grid-area:e;
    background:transparent;
    box-shadow:none;
    border:3px dashed rgba(58,42,30,0.35);
    color:rgba(58,42,30,0.55);
    clip-path:none;
  }
  .seal.add .pixel-icon{ color:rgba(58,42,30,0.55); }
  .seal.add span{ text-shadow:none; color:rgba(58,42,30,0.6); }

  .seal-field.right-grid .seal.add{ grid-area:c; }

  @media (max-width:680px), (max-height:520px){
    html,body{ height:auto; overflow:auto; }
    .stage{ height:auto; padding:20px 14px; }
    .book{ height:auto; }
    .pages{ grid-template-columns:1fr; }
    .spine{ display:none; }
    .page{ min-height:280px; }
  }
</style>
</head>
<body>

<div class="stage">
  <h1 class="stage-title">LIVRO DE ESTÍMULOS</h1>

  <div class="book">
    <div class="cover pixel-corner lg">
      <span class="cap tl"></span>
      <span class="cap tr"></span>
      <span class="cap bl"></span>
      <span class="cap br"></span>
      <div class="pages">

        <!-- LEFT PAGE -->
        <div class="page left pixel-corner md">
          <p class="plate">Wisc</p>
          <div class="seal-field left-grid">
            
            <a class="seal c-crimson seal-a pixel-corner sm" href="/completarfiguras.html" title="Editar link">
              <svg class="pixel-icon" data-pattern="01110|10001|11111|10101|01110"></svg>
              <span>Completar figuras</span>
            </a>
            <a class="seal c-navy seal-b pixel-corner sm" href="/conceitosfig.html" title="Editar link">
              <svg class="pixel-icon" data-pattern="11111|10001|10101|10001|11111"></svg>
              <span>Conceitos Figurativos</span>
            </a>
            <a class="seal c-forest seal-c pixel-corner sm" href="/raciociniomat.html" title="Editar link">
              <svg class="pixel-icon" data-pattern="00100|01110|11111|11111|10101"></svg>
              <span>Raciocínio Matricial</span>
            </a>
            <a class="seal c-amber seal-d pixel-corner sm" href="#" title="Editar link">
              <svg class="pixel-icon" data-pattern="11111|00000|11111|00000|11111"></svg>
              <span>Palavras</span>
            </a>
            <a class="seal add" href="#" title="Adicionar nova categoria">
              <svg class="pixel-icon" data-pattern="00100|00100|11111|00100|00100"></svg>
              <span>+ nova</span>
            </a>
          </div>
        </div>

        <div class="spine"></div>

        <!-- RIGHT PAGE -->
        <div class="page right pixel-corner md">
          <p class="plate">Nepsy</p>
          <div class="seal-field right-grid">
            <a class="seal c-plum seal-a pixel-corner sm" href="#" title="Editar link">
              <svg class="pixel-icon" data-pattern="10000|11000|11100|11000|10000"></svg>
              <span>Sons</span>
            </a>
            <a class="seal c-teal seal-b pixel-corner sm" href="#" title="Editar link">
              <svg class="pixel-icon" data-pattern="01010|11111|11111|01110|00100"></svg>
              <span>Memória</span>
            </a>
            <a class="seal add" href="#" title="Adicionar nova categoria">
              <svg class="pixel-icon" data-pattern="00100|00100|11111|00100|00100"></svg>
              <span>+ nova</span>
            </a>
          </div>
          <div class="dogear"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('.pixel-icon[data-pattern]').forEach(function(svg){
    var rows = svg.dataset.pattern.split('|');
    var size = rows.length;
    svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);
    rows.forEach(function(row, y){
      for (var x = 0; x < row.length; x++){
        if (row[x] === '1'){
          var r = document.createElementNS('http://www.w3.org/2000/svg','rect');
          r.setAttribute('x', x);
          r.setAttribute('y', y);
          r.setAttribute('width', 1);
          r.setAttribute('height', 1);
          svg.appendChild(r);
        }
      }
    });
  });
</script>

</body>
</html>
