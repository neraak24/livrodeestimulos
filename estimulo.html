<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estímulo</title>
<style>
:root{
  --bg:#e6e5e1;
  --btn:#d3d1cb;
  --btn-hover:#c6c4bd;
  --btn-on:#8b8880;
  --line:#bdbab2;
  --text:#5d5a54;
}
*{box-sizing:border-box;margin:0;padding:0}

html,body{width:100%;height:100dvh;overflow:hidden}

body{
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--text);
}

.screen{
  position:absolute;
  inset:.8dvh .8vw;
  display:flex;
  flex-direction:column;
  gap:.8dvh;
}

/* barra superior discreta */
.top{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  opacity:.85;
}
.top:hover{opacity:1}

.btn{
  font:inherit;
  font-size:clamp(12px,1.7dvh,14px);
  color:var(--text);
  background:var(--btn);
  border:1px solid var(--line);
  border-radius:6px;
  padding:.7dvh 12px;
  cursor:pointer;
  text-decoration:none;
  white-space:nowrap;
  line-height:1.2;
}
.btn:hover{background:var(--btn-hover)}
.btn.on{background:var(--btn-on);color:#fff;border-color:var(--btn-on)}
.btn[hidden]{display:none}
.btn.sm{font-size:clamp(11px,1.5dvh,13px);padding:.7dvh 9px}

.jumps{display:flex;gap:6px;flex:0 0 auto}
.jumps:empty{display:none}

.title{
  flex:1;
  min-width:0;
  text-align:center;
  font-size:clamp(11px,1.7dvh,14px);
  font-weight:500;
  letter-spacing:.04em;
  color:var(--text);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* número da página (sem total) — dá para digitar um número e dar Enter */
.pagenum{
  width:54px;
  font:inherit;
  font-size:clamp(12px,1.7dvh,14px);
  text-align:center;
  color:var(--text);
  background:#f3f2ef;
  border:1px solid var(--line);
  border-radius:6px;
  padding:.7dvh 4px;
  -moz-appearance:textfield;
}
.pagenum::-webkit-outer-spin-button,
.pagenum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pagenum:focus{outline:2px solid var(--btn-on);background:#fff}

/* miolo: seta | folha | seta */
.row{
  flex:1;
  min-height:0;
  display:flex;
  align-items:stretch;
  gap:.6vw;
}
.arrow{
  flex:0 0 auto;
  align-self:center;
  width:clamp(30px,3vw,44px);
  height:clamp(64px,12dvh,110px);
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--btn);
  color:var(--text);
  font-size:clamp(14px,2dvh,20px);
  cursor:pointer;
}
.arrow:hover{background:var(--btn-hover)}
.arrow:disabled{opacity:.3;cursor:default;background:var(--btn)}

.paper{
  flex:1;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
  border:1px solid var(--line);
  border-radius:4px;
}
#stage{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  background:#fff;
}

@media(max-width:650px){
  .btn.hide-sm{display:none}
}
</style>
</head>
<body>

<div class="screen">
  <div class="top">
    <a class="btn" href="index.html">‹ voltar</a>
    <div class="jumps" id="jumps"></div>
    <h1 class="title" id="title"></h1>
    <button class="btn" id="extra-btn" hidden></button>
    <input class="pagenum" id="pagenum" type="number" min="1" inputmode="numeric" title="Digite o número da página e aperte Enter">
    <button class="btn hide-sm" id="crop-btn" title="Cortar a margem branca (tecla Z)">zoom</button>
    <button class="btn hide-sm" id="full-btn" title="Tela cheia (tecla F)">tela cheia</button>
  </div>

  <div class="row">
    <button class="arrow" id="prev-btn" aria-label="anterior">◀</button>
    <div class="paper"><canvas id="stage"></canvas></div>
    <button class="arrow" id="next-btn" aria-label="próxima">▶</button>
  </div>
</div>

  function rotFor(idx){

    c.width = h; c.height = w;
    const x = c.getContext('2d');
    if(dir === 'left'){ x.translate(0, w); x.rotate(-Math.PI / 2); }

  }

  // Acha o retângulo com conteúdo analisando uma cópia reduzida (~600 px): 10x mais rápido e o resultado é o mesmo
  function findBox(item, skipTop){
    const img = item.img, W = item.w, H = item.h;
    try{
      const s = Math.min(1, 600 / Math.max(W, H));
      const w = Math.max(1, Math.round(W * s)), h = Math.max(1, Math.round(H * s));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d', {willReadFrequently:true});
      x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
      x.drawImage(img, 0, 0, w, h);

        for(let xx=0; xx<w; xx++){
          const i = (y*w + xx) * 4;
          if(d[i] < 170 || d[i+1] < 170 || d[i+2] < 170){ rows[y]++; cols[xx]++; }
        }
      }
      const MIN = Math.max(2, Math.round(20 * s));  // ignora pontinhos/ruído de escaneamento
      let t=y0, b=h-1, l=0, r=w-1;

      if(r<=l || b<=t) return {x:0,y:0,w:W,h:H};

      l = Math.max(0, l-pad); t = Math.max(y0, t-pad);

      const X = Math.floor(l / s), Y = Math.floor(t / s);
      return {x:X, y:Y, w:Math.min(W, Math.ceil((r+1) / s)) - X, h:Math.min(H, Math.ceil((b+1) / s)) - Y};
