<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEUPSILIN — PERCEPÇÃO VISUAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#6d4d5e; --bg-dark:#4d3345;
    --page-l:#ecdcab; --ink:#3a2a1e; --gold:#c9a24b; --gold-dark:#8f7431;
  }
  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100dvh;
    overflow:hidden;
    background:radial-gradient(ellipse at 50% 15%, var(--bg), var(--bg-dark) 85%);
    font-family:'VT323', monospace;
    color:var(--ink);
  }

  .screen{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:2dvh 3vw;
    gap:1.6dvh;
  }

  .top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:0 0 auto;
  }
  .back{
    font-family:'Press Start 2P', monospace;
    font-size:11px;
    color:#f4e9c8;
    text-decoration:none;
    background:var(--bg-dark);
    border:2px solid var(--gold-dark);
    padding:8px 12px;
  }
  .back:hover{ filter:brightness(1.15); }
  .title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(11px,1.9dvh,17px);
    color:#f4e9c8;
    text-shadow:3px 3px 0 rgba(0,0,0,0.5);
    text-align:center;
  }

  .frame{
    flex:1;
    min-height:0;
    background:var(--page-l);
    border:3px solid #1a0f1a;
    box-shadow:8px 8px 0 rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2dvh;
  }
  .frame img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border:3px solid #1a0f1a;
    background:#fff;
  }

  .nav{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
  }
  .nav button{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(11px,1.6dvh,15px);
    color:#fbf1da;
    background:#436b47;
    border:none;
    padding:1.4dvh 2.2vw;
    cursor:pointer;
    box-shadow:
      inset -4px -4px 0 rgba(0,0,0,0.28),
      inset 4px 4px 0 rgba(255,255,255,0.22);
  }
  .nav button:hover{ filter:brightness(1.08); }
  .nav button:active{ transform:translateY(1px); }
  .nav button:disabled{ opacity:0.4; cursor:default; }
  .nav button.prev{ background:#33526e; }
</style>
</head>
<body>

  <div class="screen">
    <div class="top">
      <a class="back" href="index.html">‹ voltar</a>
      <h1 class="title">NEUPSILIN — PERCEPÇÃO VISUAL</h1>
    </div>

    <div class="frame">
      <img id="stimulus-img" src="" alt="Estímulo">
    </div>

    <div class="nav">
      <button class="prev" id="prev-btn">◀ anterior</button>
      <button class="next" id="next-btn">próxima ▶</button>
    </div>
  </div>

<script>
  const images = [
    "Neupsilin%20Percep%C3%A7%C3%A3o%20Visual/1.png",
    "Neupsilin%20Percep%C3%A7%C3%A3o%20Visual/2.png",
    "Neupsilin%20Percep%C3%A7%C3%A3o%20Visual/3.png",
    "Neupsilin%20Percep%C3%A7%C3%A3o%20Visual/4.png"
  ];

  let current = 0;
  const img = document.getElementById('stimulus-img');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');

  function render(){
    img.src = images[current];
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === images.length - 1;
  }

  prevBtn.addEventListener('click', function(){
    if (current > 0){ current--; render(); }
  });
  nextBtn.addEventListener('click', function(){
    if (current < images.length - 1){ current++; render(); }
  });

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'ArrowLeft') prevBtn.click();
  });

  render();
</script>

</body>
</html>
